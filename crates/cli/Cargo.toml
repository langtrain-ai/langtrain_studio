[package]
name = "langtrain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Langtrain Studio: fast local LLM serving and CPU fine-tuning"

[[bin]]
name = "langtrain"
path = "src/main.rs"

[features]
default = ["llama"]
llama = ["langtrain-server/llama"]
metal = ["langtrain-server/metal"]
cuda = ["langtrain-server/cuda"]
vulkan = ["langtrain-server/vulkan"]

[dependencies]
langtrain-engine = { path = "../engine" }
langtrain-server = { path = "../server" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures = "0.3"
indicatif = "0.18"
dirs = "6"
serde = { workspace = true }
