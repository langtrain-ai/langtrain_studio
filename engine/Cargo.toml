[workspace]
resolver = "2"
exclude = ["studio/src-tauri"]
members = ["crates/engine", "crates/native", "crates/web", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/langtrain/langtrain-studio"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
llama-cpp-2 = { version = "0.1.160", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
