[package]
name = "langtrain-studio"
version = "0.1.0"
edition = "2021"
description = "Langtrain Studio desktop app"
license = "Apache-2.0"

# The desktop shell is built separately from the main workspace (it needs the
# Tauri toolchain and platform webview libraries).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
