[package]
name = "langtrain-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
llama = ["langtrain-engine/llama"]
metal = ["langtrain-engine/metal"]
cuda = ["langtrain-engine/cuda"]
vulkan = ["langtrain-engine/vulkan"]

[dependencies]
langtrain-engine = { path = "../engine" }
langtrain-web = { path = "../web" }
langtrain-native = { path = "../native" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-stream = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
