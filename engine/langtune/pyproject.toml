[project]
name = "langtune"
version = "0.1.0"
description = "LoRA fine-tuning on CPU (and Apple/NVIDIA GPUs) for Langtrain Studio"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "torch>=2.4",
  "transformers>=4.46",
  "gguf>=0.10",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
langtune = "langtune.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langtune"]
